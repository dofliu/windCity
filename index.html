<canvas id="cv" aria-label="風場地圖"></canvas>

<div id="hud">
  <header id="top">
    <div class="brand glass">
      <div class="logo"><svg class="ic"><use href="#i-turbine"/></svg></div>
      <div><h1>風場大亨</h1><p id="date"></p></div>
    </div>
    <div id="res" class="glass">
      <div class="chip" id="c-cash"><svg class="ic"><use href="#i-coin"/></svg><div><span class="k">資金 NT$</span><span class="v"></span></div></div>
      <div class="chip" id="c-steel"><svg class="ic"><use href="#i-steel"/></svg><div><span class="k">鋼材</span><span class="v"></span></div></div>
      <div class="chip" id="c-blade"><svg class="ic"><use href="#i-blade"/></svg><div><span class="k">葉片</span><span class="v"></span></div></div>
      <div class="chip" id="c-crew"><svg class="ic"><use href="#i-crew"/></svg><div><span class="k">工班</span><span class="v"></span></div></div>
      <div class="chip" id="c-ves" hidden><svg class="ic"><use href="#i-ship"/></svg><div><span class="k">工作船</span><span class="v"></span></div></div>
      <div class="chip" id="c-sup"><svg class="ic"><use href="#i-heart"/></svg><div><span class="k">民眾支持</span><span class="v"></span></div></div>
    </div>
    <div class="tbtns">
      <button class="tbtn glass" id="bMarket"><svg class="ic"><use href="#i-cart"/></svg>市場</button>
      <button class="tbtn glass" id="bGoals"><svg class="ic"><use href="#i-target"/></svg>目標</button>
      <button class="tbtn glass" id="bSound" data-silent="1" aria-label="聲音開關"></button>
      <button class="tbtn glass" id="bMenu"><svg class="ic"><use href="#i-menu"/></svg>選單</button>
    </div>
  </header>

  <div id="mid">
    <div id="leftcol">
      <nav id="layers" class="glass" aria-label="圖層">
        <button class="lay" data-ov="wind" aria-pressed="false"><svg class="ic"><use href="#i-wind"/></svg>風能</button>
        <button class="lay" data-ov="land" aria-pressed="false"><svg class="ic"><use href="#i-land"/></svg>土地</button>
        <button class="lay" data-ov="grid" aria-pressed="false"><svg class="ic"><use href="#i-bolt"/></svg>電網</button>
        <button class="lay" data-ov="wake" aria-pressed="false"><svg class="ic"><use href="#i-wake"/></svg>尾流</button>
      </nav>
      <div id="zoom" class="glass">
        <button id="zIn" aria-label="放大"><svg class="ic"><use href="#i-plus"/></svg></button>
        <button id="zOut" aria-label="縮小"><svg class="ic"><use href="#i-minus"/></svg></button>
        <button id="zHome" aria-label="回到我的土地"><svg class="ic"><use href="#i-focus"/></svg></button>
      </div>
      <div id="legend" class="glass" hidden></div>
    </div>
    <div id="side">
      <section id="kpi" class="glass">
        <button class="kpi-head" id="kpiHead">
          <span class="eyebrow">風場營運</span>
          <span id="kPipe" class="pipe"></span>
          <span class="kpi-mw"><b id="kMW">0.0</b><small>MW</small></span>
          <svg class="ic chev"><use href="#i-chev"/></svg>
        </button>
        <div class="kpi-body">
          <div class="kgrid">
            <div id="g-e"><span>上季發電</span><b id="kE">—</b><small>GWh</small></div>
            <div id="g-cf"><span>容量因數</span><b id="kCF">—</b><small>%</small></div>
            <div id="g-av"><span>可用率</span><b id="kAV">—</b><small>%</small></div>
            <div id="g-pr"><span>效能 PR</span><b id="kPR">—</b><small>%</small></div>
            <div id="g-wk"><span>尾流損失</span><b id="kWK">—</b><small>%</small></div>
            <div id="g-tr"><span>售電費率</span><b id="kTR">—</b><small>元</small></div>
          </div>
          <canvas id="spark"></canvas>
          <div class="windrow"><svg class="ic" id="wArrow"><use href="#i-arrow"/></svg><span id="kWind"></span></div>
        </div>
      </section>
      <section id="insp" class="glass" hidden></section>
    </div>
  </div>

  <div id="bottom">
    <div id="confirm" class="glass" hidden></div>
    <div id="tray" class="glass" hidden></div>
    <nav id="dock" class="glass" aria-label="工具">
      <button class="cat" data-cat="inspect" aria-pressed="true"><svg class="ic"><use href="#i-cursor"/></svg>檢視</button>
      <button class="cat" data-cat="turb" aria-pressed="false"><svg class="ic"><use href="#i-turbine"/></svg>風機</button>
      <button class="cat" data-cat="fac" aria-pressed="false"><svg class="ic"><use href="#i-building"/></svg>設施</button>
      <button class="cat" data-cat="land" aria-pressed="false"><svg class="ic"><use href="#i-land"/></svg>土地</button>
      <button class="cat" data-cat="bull" aria-pressed="false"><svg class="ic"><use href="#i-bulldoze"/></svg>拆除</button>
      <button id="next"><div class="play"><svg class="ic"><use href="#i-play"/></svg></div><span><span id="nextLbl">結束本季</span><small id="nextSub"></small></span></button>
    </nav>
  </div>
</div>

<div id="qbanner" aria-live="polite"></div>
<div id="cine" hidden aria-live="polite"></div>
<div id="spot" hidden></div>
<div id="tapHint" hidden><svg class="ic"><use href="#i-cursor"/></svg></div>
<div id="coach" role="dialog" aria-live="polite" hidden></div>
<div id="levels" hidden></div>
<div id="modal" hidden><div class="card" id="mcard" role="dialog" aria-modal="true"></div></div>
<div id="toasts" aria-live="polite"></div>
<script src="js/config.js"></script>
<script src="js/levels.js"></script>
<script src="js/state.js"></script>
<script src="js/turn.js"></script>
<script src="js/render.js"></script>
<script src="js/audio.js"></script>
<script src="js/fx.js"></script>
<script src="js/cine.js"></script>
<script src="js/input.js"></script>
<script src="js/ui.js"></script>
<script src="js/sandbox.js"></script>
<script src="js/admin.js"></script>
<script src="js/menu.js"></script>
<script src="js/tutorial.js"></script>
<script src="js/main.js"></script>
</body>
</html>
